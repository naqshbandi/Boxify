<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایپ - فائر بیس سنک کے ساتھ</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; text-align: right; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
        .hidden { display: none; }
        .screenshot-card { border: 1px solid #ddd; padding: 10px; margin-top: 10px; border-radius: 4px; background: #fafafa; }
        img { max-width: 100%; height: auto; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container" id="app">
    <h2>لاگ ان / سائن اپ</h2>
    <div id="auth-section">
        <input type="text" id="username" placeholder="یوزر نیم درج کریں">
        <input type="password" id="password" placeholder="پاسورڈ درج کریں">
        <button onclick="handleLogin()">لاگ ان / سائن اپ</button>
    </div>

    <div id="dashboard" class="hidden">
        <h3 id="welcome-msg"></h3>
        
        <div id="user-panel" class="hidden">
            <h4>سکرین شاٹ اپ لوڈ کریں</h4>
            <input type="file" id="screenshot-file" accept="image/*">
            <button onclick="uploadScreenshot()">اپ لوڈ کریں</button>
        </div>

        <div id="admin-panel" class="hidden">
            <h4>ایڈمن پینل - تمام سکرین شاٹس</h4>
            <div id="admin-screenshots-list"></div>
        </div>

        <button onclick="handleLogout()" style="background: #f44336; margin-top: 20px;">لاگ آؤٹ</button>
    </div>
</div>

<script>
    // آپ کی فائر بیس کنفیگریشن (Firebase Realtime Database)
    const firebaseConfig = {
        apiKey: "AIzaSyDummyKeyForNow-ReplaceWithYours",
        authDomain: "your-app-default-rtdb.firebaseio.com",
        databaseURL: "https://your-app-default-rtdb.firebaseio.com",
        projectId: "your-app",
        storageBucket: "your-app.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    // فائر بیس انیشیলাইزیشن
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentUser = null;

    function handleLogin() {
        const user = document.getElementById('username').value.trim();
        if (!user) {
            alert('براہ کرم یوزر نیم درج کریں');
            return;
        }
        currentUser = user;
        localStorage.setItem('chat_app_user', currentUser);
        loadDashboard();
    }

    function handleLogout() {
        localStorage.removeItem('chat_app_user');
        currentUser = null;
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }

    function loadDashboard() {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('welcome-msg').innerText = `خوش آمدید، ${currentUser}`;

        if (currentUser === '7Dr-as') {
            document.getElementById('admin-panel').classList.remove('hidden');
            document.getElementById('user-panel').classList.add('hidden');
            fetchAllScreenshots();
        } else {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('user-panel').classList.remove('hidden');
        }
    }

    function uploadScreenshot() {
        const fileInput = document.getElementById('screenshot-file');
        if (fileInput.files.length === 0) {
            alert('براہ کرم پہلے سکرین شاٹ منتخب کریں');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Image = e.target.result;
            
            // فائر بیس ڈیٹا بیس میں ڈیٹا محفوظ کرنا
            const newPostRef = db.ref('screenshots').push();
            newPostRef.set({
                username: currentUser,
                image: base64Image,
                timestamp: Date.now()
            }, (error) => {
                if (error) {
                    alert('اپ لوڈ کرنے میں خرابی پیش آئی!');
                } else {
                    alert('سکرین شاٹ کامیابی سے فائر بیس پر اپ لوڈ ہو گیا!');
                    fileInput.value = '';
                }
            });
        };
        reader.readAsDataURL(file);
    }

    function fetchAllScreenshots() {
        const listDiv = document.getElementById('admin-screenshots-list');
        // فائر بیس سے رئیل ٹائم ڈیٹا سنک (Realtime listener)
        db.ref('screenshots').on('value', (snapshot) => {
            listDiv.innerHTML = '';
            const data = snapshot.val();
            if (!data) {
                listDiv.innerHTML = '<p>کوئی سکرین شاٹ موجود نہیں ہے۔</p>';
                return;
            }

            Object.keys(data).forEach((key) => {
                const item = data[key];
                const card = document.createElement('div');
                card.className = 'screenshot-card';
                card.innerHTML = `
                    <strong>یوزر: ${item.username}</strong>
                    <br><small>وقت: ${new Date(item.timestamp).toLocaleString()}</small>
                    <br><img src="${item.image}" alt="Screenshot">
                `;
                listDiv.appendChild(card);
            });
        });
    }

    // آٹو لاگ ان چیک
    window.onload = function() {
        const savedUser = localStorage.getItem('chat_app_user');
        if (savedUser) {
            currentUser = savedUser;
            loadDashboard();
        }
    }
</script>

</body>
</html>
