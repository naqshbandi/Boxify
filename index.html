<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxify Gift - Full Cloud Configured</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        jasper: {
                            50: '#f4f6f8',
                            100: '#e1e5eb',
                            200: '#c5ccd6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e3a8a',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase v8 SDK Compatibility CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-jasper-50 text-jasper-950 min-h-screen flex flex-col antialiased">

    <div id="app" class="flex-1 flex flex-col"></div>
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>
    <div id="modal-container"></div>

    <script>
        /* ==========================================================
           1. FIREBASE CONFIGURATION & INITIALIZATION
           ================================================---------- */
        const firebaseConfig = {
            apiKey: "AIzaSyAZTA87zhyJRHaCIKVDEG36E9wLR-Qnt80",
            authDomain: "boxifyapp-6f63f.firebaseapp.com",
            databaseURL: "https://boxifyapp-6f63f-default-rtdb.firebaseio.com",
            projectId: "boxifyapp-6f63f",
            storageBucket: "boxifyapp-6f63f.firebasestorage.app",
            messagingSenderId: "845814985925",
            appId: "1:845814985925:web:b7583e2feed78b4ea82cac"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        /* ==========================================================
           2. CLOUD FIRESTORE SYNCHRONIZATION ENGINE
           ================================================---------- */
        const DB_KEYS = {
            SESSION: 'boxify_session_v1'
        };

        let cloudState = {
            users: [],
            deposits: [],
            withdrawals: []
        };

        function initCloudSync(callback) {
            db.collection('boxify_cloud_users').doc('all_users').onSnapshot((doc) => {
                if (doc.exists) {
                    cloudState.users = JSON.parse(doc.data().data || '[]');
                } else {
                    cloudState.users = [
                        { username: 'admin', email: '7Dr-as', pass: 'admin123', balance: 0, referrer: '', depositsCount: 0, hasPlayed: false },
                        { username: 'alex99', email: 'alex@gmail.com', pass: 'password123', balance: 150, referrer: '', depositsCount: 1, hasPlayed: false }
                    ];
                    syncCloudUsers();
                }
                if (callback) callback();
            });

            db.collection('boxify_cloud_deposits').doc('all_deposits').onSnapshot((doc) => {
                if (doc.exists) {
                    cloudState.deposits = JSON.parse(doc.data().data || '[]');
                } else {
                    cloudState.deposits = [];
                    syncCloudDeposits();
                }
                if (callback) callback();
            });
        }

        function syncCloudUsers() {
            db.collection('boxify_cloud_users').doc('all_users').set({
                data: JSON.stringify(cloudState.users),
                updatedAt: Date.now()
            }).catch(err => console.error("User cloud sync error:", err));
        }

        function syncCloudDeposits() {
            db.collection('boxify_cloud_deposits').doc('all_deposits').set({
                data: JSON.stringify(cloudState.deposits),
                updatedAt: Date.now()
            }).catch(err => console.error("Deposit cloud sync error:", err));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-white text-sm font-medium shadow-lg flex items-center gap-3 transition-all ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem(DB_KEYS.SESSION));
        }

        function setCurrentUser(user) {
            if (user) localStorage.setItem(DB_KEYS.SESSION, JSON.stringify(user));
            else localStorage.removeItem(DB_KEYS.SESSION);
        }

        function router() {
            const user = getCurrentUser();
            const hash = window.location.hash.replace('#', '') || 'home';

            if (!user) {
                renderAuthPage();
            } else if (user.email === '7Dr-as' || user.username === 'admin') {
                renderAdminPanel();
            } else {
                renderDashboard(hash);
            }
        }

        window.addEventListener('hashchange', router);

        /* ==========================================================
           3. AUTHENTICATION MODULE (CLOUD-BACKED)
           ================================================---------- */
        function renderAuthPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref') || '';

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-jasper-100 via-white to-jasper-100">
                    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-jasper-100 p-8">
                        <div class="text-center mb-6">
                            <h2 class="text-3xl font-bold tracking-tight text-jasper-900">Boxify Gift</h2>
                            <p class="text-sm text-gray-500 mt-1">Sign in or register to continue</p>
                        </div>

                        <div class="flex rounded-xl bg-jasper-50 p-1 mb-6">
                            <button id="tab-signin" onclick="switchAuthTab('signin')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-jasper-900 shadow-sm">Sign In</button>
                            <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500">Sign Up</button>
                        </div>

                        <form id="form-signin" onsubmit="handleSignIn(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Email or Username (Admin: 7Dr-as)</label>
                                <input type="text" id="signin-identity" required class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Password</label>
                                <input type="password" id="signin-password" required class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 text-sm">
                            </div>
                            <button type="submit" class="w-full py-3 bg-jasper-600 hover:bg-jasper-700 text-white font-semibold rounded-xl text-sm">Sign In</button>
                        </form>

                        <form id="form-signup" onsubmit="handleSignUp(event)" class="space-y-4 hidden">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Username</label>
                                <input type="text" id="signup-username" required class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Email</label>
                                <input type="email" id="signup-email" required class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Password</label>
                                <input type="password" id="signup-password" required class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Referral Code (Optional)</label>
                                <input type="text" id="signup-referral" value="${refCode}" class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 text-sm">
                            </div>
                            <div class="flex items-start gap-3 pt-1">
                                <input type="checkbox" id="signup-terms" onchange="toggleSignUpButton()" class="mt-1 h-4 w-4 rounded text-jasper-600">
                                <label for="signup-terms" class="text-xs text-gray-600">I agree to all terms and policies</label>
                            </div>
                            <button type="submit" id="btn-signup-submit" disabled class="w-full py-3 bg-gray-300 text-gray-500 font-semibold rounded-xl text-sm cursor-not-allowed">Create Account</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function switchAuthTab(tab) {
            const signinForm = document.getElementById('form-signin');
            const signupForm = document.getElementById('form-signup');
            const signinTab = document.getElementById('tab-signin');
            const signupTab = document.getElementById('tab-signup');

            if (tab === 'signin') {
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                signinTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-jasper-900 shadow-sm";
                signupTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500";
            } else {
                signupForm.classList.remove('hidden');
                signinForm.classList.add('hidden');
                signupTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-jasper-900 shadow-sm";
                signupTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500";
            }
        }

        function toggleSignUpButton() {
            const checkbox = document.getElementById('signup-terms');
            const btn = document.getElementById('btn-signup-submit');
            if (!btn) return;
            if (checkbox.checked) {
                btn.disabled = false;
                btn.className = "w-full py-3 bg-jasper-600 hover:bg-jasper-700 text-white font-semibold rounded-xl text-sm cursor-pointer";
            } else {
                btn.disabled = true;
                btn.className = "w-full py-3 bg-gray-300 text-gray-500 font-semibold rounded-xl text-sm cursor-not-allowed";
            }
        }

        function handleSignIn(e) {
            e.preventDefault();
            const identity = document.getElementById('signin-identity').value.trim();
            const pass = document.getElementById('signin-password').value.trim();

            if (identity === '7Dr-as') {
                setCurrentUser({ username: 'admin', email: '7Dr-as', balance: 0 });
                showToast('Welcome to Admin Panel!');
                router();
                return;
            }

            const found = cloudState.users.find(u => (u.email === identity || u.username === identity) && u.pass === pass);

            if (found) {
                setCurrentUser(found);
                showToast(`Welcome back, ${found.username}!`);
                router();
            } else {
                showToast('Invalid credentials or user does not exist!', 'error');
            }
        }

        function handleSignUp(e) {
            e.preventDefault();
            const username = document.getElementById('signup-username').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const pass = document.getElementById('signup-password').value.trim();
            const referrer = document.getElementById('signup-referral').value.trim();

            if (cloudState.users.some(u => u.username === username)) {
                showToast('Username already exists!', 'error');
                return;
            }

            const newUser = { username, email, pass, balance: 0, referrer: referrer || '', depositsCount: 0, hasPlayed: false };
            cloudState.users.push(newUser);
            syncCloudUsers();
            setCurrentUser(newUser);
            showToast('Account created successfully!');
            router();
        }

        /* ==========================================================
           4. ADMIN PANEL (LIVE MULTI-DEVICE SCREENSHOT VIEW & APPROVAL)
           ================================================---------- */
        function renderAdminPanel() {
            const pendingDeposits = cloudState.deposits.filter(d => d.status === 'pending');

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen bg-jasper-50 flex flex-col">
                    <header class="bg-white border-b border-jasper-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <h2 class="text-xl font-bold text-jasper-900">Admin Panel - Live Cloud Deposit Screenshots</h2>
                        <button onclick="handleLogout()" class="px-4 py-2 bg-rose-50 text-rose-600 font-medium rounded-xl text-sm">Sign Out</button>
                    </header>
                    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">
                        <section class="bg-white rounded-2xl shadow-sm border border-jasper-100 p-6">
                            <h3 class="text-lg font-bold text-jasper-900 mb-4">Pending Deposits & Screenshots from All Devices</h3>
                            ${pendingDeposits.length === 0 ? '<p class="text-gray-500 text-sm">No pending deposit requests available.</p>' : `
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left text-sm">
                                        <thead class="bg-jasper-50 text-jasper-800 uppercase text-xs">
                                            <tr>
                                                <th class="p-3">Username</th>
                                                <th class="p-3">Amount</th>
                                                <th class="p-3">Screenshot Proof (Click to Zoom)</th>
                                                <th class="p-3">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-jasper-100">
                                            ${pendingDeposits.map(d => `
                                                <tr>
                                                    <td class="p-3 font-medium">${d.username}</td>
                                                    <td class="p-3 font-bold text-emerald-600">Rs. ${d.amount}</td>
                                                    <td class="p-3">
                                                        <img src="${d.proof}" alt="Proof" class="w-16 h-16 object-cover rounded-lg cursor-pointer border shadow-sm hover:opacity-80 transition" onclick="showZoomModal('${d.proof}')">
                                                    </td>
                                                    <td class="p-3 flex gap-2">
                                                        <button onclick="approveDeposit('${d.id}')" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-semibold">Approve</button>
                                                        <button onclick="rejectDeposit('${d.id}')" class="px-3 py-1.5 bg-rose-600 text-white rounded-lg text-xs font-semibold">Reject</button>
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            `}
                        </section>
                    </main>
                </div>
            `;
        }

        function showZoomModal(imgSrc) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onclick="closeModal()">
                    <div class="relative max-w-4xl w-full bg-white rounded-2xl p-4 text-center shadow-2xl" onclick="event.stopPropagation()">
                        <button onclick="closeModal()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-gray-100 font-bold hover:bg-gray-200">×</button>
                        <h3 class="text-lg font-bold text-jasper-900 mb-3">Screenshot Full View</h3>
                        <div class="max-h-[75vh] overflow-auto flex items-center justify-center bg-jasper-50 rounded-xl p-2">
                            <img src="${imgSrc}" class="max-w-full h-auto rounded-lg shadow-md object-contain">
                        </div>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            const modal = document.getElementById('modal-container');
            if (modal) modal.innerHTML = '';
        }

        function approveDeposit(depId) {
            const dep = cloudState.deposits.find(d => d.id === depId);
            if (!dep) return;

            dep.status = 'approved';
            syncCloudDeposits();

            const user = cloudState.users.find(u => u.username === dep.username);
            if (user) {
                user.balance = (user.balance || 0) + dep.amount;
                user.depositsCount = (user.depositsCount || 0) + 1;
                user.hasPlayed = false;
                syncCloudUsers();
            }

            showToast('Deposit approved successfully!');
            renderAdminPanel();
        }

        function rejectDeposit(depId) {
            const dep = cloudState.deposits.find(d => d.id === depId);
            if (dep) {
                dep.status = 'rejected';
                syncCloudDeposits();
                showToast('Deposit rejected!', 'error');
                renderAdminPanel();
            }
        }

        function handleLogout() {
            setCurrentUser(null);
            showToast('Signed out successfully');
            router();
        }

        /* ==========================================================
           5. USER DASHBOARD & CLOUD SCREENSHOT UPLOAD
           ================================================---------- */
        function renderDashboard() {
            const user = getCurrentUser();
            const currentUserData = cloudState.users.find(u => u.username === user.username) || user;

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen bg-jasper-50 flex flex-col relative">
                    <header class="bg-white border-b border-jasper-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <h2 class="text-xl font-bold text-jasper-900 cursor-pointer" onclick="window.location.hash='home'">Boxify Gift</h2>
                        <div class="flex items-center gap-4">
                            <span class="text-sm font-semibold text-gray-700">Welcome, ${currentUserData.username}</span>
                            <button onclick="handleLogout()" class="px-3 py-1.5 bg-rose-50 text-rose-600 rounded-lg text-xs font-semibold">Sign Out</button>
                        </div>
                    </header>
                    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">
                        <div class="text-center py-4 bg-white rounded-2xl shadow-sm border p-4">
                            <span class="text-xs font-semibold uppercase text-gray-500">Available Balance</span>
                            <h3 class="text-3xl font-extrabold text-jasper-900 mt-1">Rs. ${currentUserData.balance || 0}</h3>
                        </div>

                        <div class="bg-gradient-to-r from-jasper-800 to-jasper-700 text-white rounded-2xl p-6 shadow-md space-y-4">
                            <h4 class="font-bold text-lg">Deposit Minimum Rs. 100 via Easypaisa</h4>
                            <p class="text-xs text-jasper-100">Account Number: <strong>03074591741</strong> (Name: Adnan Ahmad)</p>
                            <button onclick="openDepositModal()" class="w-full py-3 bg-white text-jasper-900 font-bold rounded-xl shadow text-sm">Upload Deposit Screenshot</button>
                        </div>

                        <div class="bg-white rounded-2xl shadow-sm border p-6 text-center">
                            <h3 class="text-xl font-bold text-jasper-900 mb-2">Select Mystery Boxes</h3>
                            <div class="grid grid-cols-3 sm:grid-cols-5 gap-3">
                                ${Array.from({length: 15}).map((_, i) => `
                                    <div onclick="handleBoxClick(${i})" id="box-${i}" class="aspect-square bg-jasper-600 rounded-2xl shadow flex flex-col items-center justify-center cursor-pointer text-white p-2 hover:bg-jasper-700 transition">
                                        <i class="fa-solid fa-box-open text-2xl mb-1 text-amber-300"></i>
                                        <span class="text-xs">Box #${i+1}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function openDepositModal() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
                        <h3 class="text-lg font-bold text-jasper-900">Upload Deposit Screenshot (Any Image Format)</h3>
                        <input type="file" id="deposit-file-input" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-jasper-50 file:text-jasper-700">
                        <div class="flex gap-3 pt-2">
                            <button onclick="closeModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl text-sm">Cancel</button>
                            <button onclick="submitDepositProof()" class="flex-1 py-2.5 bg-jasper-600 text-white rounded-xl text-sm font-semibold">Submit</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function submitDepositProof() {
            const user = getCurrentUser();
            const fileInput = document.getElementById('deposit-file-input');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                showToast('Please select a screenshot file!', 'error');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const newDeposit = {
                    id: 'dep_' + Date.now(),
                    username: user ? user.username : 'Unknown',
                    amount: 100,
                    proof: e.target.result,
                    status: 'pending',
                    timestamp: Date.now()
                };

                cloudState.deposits.push(newDeposit);
                syncCloudDeposits();

                closeModal();
                showToast('Deposit screenshot uploaded to Firebase cloud successfully!');
            };
            reader.readAsDataURL(file);
        }

        let gameState = { openedBoxes: [] };

        function handleBoxClick(index) {
            const user = getCurrentUser();
            const dbUser = cloudState.users.find(u => u.username === user.username) || user;

            if (!dbUser || dbUser.balance <= 0) {
                showToast('Please deposit first and wait for admin approval!', 'error');
                return;
            }
            if (gameState.openedBoxes.includes(index)) {
                showToast('This box has already been opened!', 'error');
                return;
            }

            gameState.openedBoxes.push(index);
            const reward = Math.floor(Math.random() * 20) + 10;
            
            dbUser.balance += reward;
            syncCloudUsers();
            setCurrentUser(dbUser);

            const boxEl = document.getElementById(`box-${index}`);
            if (boxEl) {
                boxEl.className = "aspect-square bg-emerald-600 rounded-2xl shadow flex flex-col items-center justify-center text-white p-2";
                boxEl.innerHTML = `<i class="fa-solid fa-coins text-2xl mb-1 text-amber-300"></i><span class="text-xs font-bold">+Rs. ${reward}</span>`;
            }

            showToast(`You have won Rs. ${reward}!`);
            setTimeout(() => router(), 1500);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCloudSync(() => {
                router();
            });
        });
    </script>
</body>
</html>
