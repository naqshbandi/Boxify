<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxify Gift</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        jasper: {
                            50: '#f4f6f8',
                            100: '#e1e5eb',
                            200: '#c5ccd6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e3a8a',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-jasper-50 text-jasper-950 min-h-screen flex flex-col antialiased">

    <div id="app" class="flex-1 flex flex-col"></div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <div id="modal-container"></div>

    <script>
        /* ==========================================================
           STORAGE SCHEMAS & INITIALIZATION
           ================================================---------- */
        const DB_KEYS = {
            USERS: 'boxify_users_v2',
            SESSION: 'boxify_session_v2',
            DEPOSITS: 'boxify_deposits_v2',
            WITHDRAWALS: 'boxify_withdrawals_v2',
            LIVE_FEED: 'boxify_live_feed_v2'
        };

        function initDatabase() {
            if (!localStorage.getItem(DB_KEYS.USERS)) {
                const defaultUsers = [
                    { username: 'admin', email: '7Dr-as', pass: 'admin123', balance: 0, referrer: '', depositsCount: 0 },
                    { username: 'player_one', email: 'player@gmail.com', pass: 'password123', balance: 0, referrer: '', depositsCount: 0 },
                    { username: 'ref1', email: 'ref1@gmail.com', pass: '123456', balance: 0, referrer: 'player_one', depositsCount: 1 },
                    { username: 'ref2', email: 'ref2@gmail.com', pass: '123456', balance: 0, referrer: 'player_one', depositsCount: 1 },
                    { username: 'ref3', email: 'ref3@gmail.com', pass: '123456', balance: 0, referrer: 'player_one', depositsCount: 1 },
                    { username: 'ref4', email: 'ref4@gmail.com', pass: '123456', balance: 0, referrer: 'player_one', depositsCount: 1 },
                    { username: 'ref5', email: 'ref5@gmail.com', pass: '123456', balance: 0, referrer: 'player_one', depositsCount: 1 }
                ];
                localStorage.setItem(DB_KEYS.USERS, JSON.stringify(defaultUsers));
            }
            if (!localStorage.getItem(DB_KEYS.DEPOSITS)) {
                localStorage.setItem(DB_KEYS.DEPOSITS, JSON.stringify([
                    { id: 'dep_init_1', username: 'ref1', amount: 100, proof: 'proof1.png', status: 'approved', timestamp: Date.now() },
                    { id: 'dep_init_2', username: 'ref2', amount: 100, proof: 'proof2.png', status: 'approved', timestamp: Date.now() },
                    { id: 'dep_init_3', username: 'ref3', amount: 100, proof: 'proof3.png', status: 'approved', timestamp: Date.now() },
                    { id: 'dep_init_4', username: 'ref4', amount: 100, proof: 'proof4.png', status: 'approved', timestamp: Date.now() },
                    { id: 'dep_init_5', username: 'ref5', amount: 100, proof: 'proof5.png', status: 'approved', timestamp: Date.now() }
                ]));
            }
            if (!localStorage.getItem(DB_KEYS.WITHDRAWALS)) {
                localStorage.setItem(DB_KEYS.WITHDRAWALS, JSON.stringify([]));
            }
            if (!localStorage.getItem(DB_KEYS.LIVE_FEED)) {
                localStorage.setItem(DB_KEYS.LIVE_FEED, JSON.stringify([
                    { user: 'ref1', amount: 45, time: '3 mins ago' },
                    { user: 'ref2', amount: 50, time: '10 mins ago' }
                ]));
            }
        }

        initDatabase();

        const getStorage = (key) => JSON.parse(localStorage.getItem(key) || '[]');
        const setStorage = (key, data) => localStorage.setItem(key, JSON.stringify(data));

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-white text-sm font-semibold shadow-xl flex items-center gap-3 transition-all transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 20);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function copyToClipboard(text, label = 'Text') {
            navigator.clipboard.writeText(text);
            showToast(`${label} copied successfully!`);
        }

        function getCurrentUser() {
            return JSON.parse(localStorage.getItem(DB_KEYS.SESSION));
        }

        function setCurrentUser(user) {
            if (user) localStorage.setItem(DB_KEYS.SESSION, JSON.stringify(user));
            else localStorage.removeItem(DB_KEYS.SESSION);
        }

        /* ==========================================================
           ROUTER CONTROLLER
           ================================================---------- */
        function router() {
            const user = getCurrentUser();
            const hash = window.location.hash.replace('#', '') || 'home';

            if (!user) {
                renderAuthPage();
            } else if (user.email === '7Dr-as' || user.username === 'admin') {
                renderAdminPanel();
            } else {
                renderDashboard(hash);
            }
        }

        window.addEventListener('hashchange', router);

        /* ==========================================================
           1. AUTH PAGE (SIGN UP & SIGN IN WITH FUNCTIONAL PASSWORD TOGGLE)
           ================================================---------- */
        function renderAuthPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref') || '';

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-jasper-100 via-white to-jasper-100">
                    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-jasper-100 p-8">
                        <div class="text-center mb-6">
                            <h2 class="text-3xl font-bold tracking-tight text-jasper-900">Boxify Gift</h2>
                            <p class="text-sm text-gray-500 mt-1">Sleek rewarding mystery box platform</p>
                        </div>

                        <div class="flex rounded-xl bg-jasper-50 p-1 mb-6">
                            <button id="tab-signin" onclick="switchAuthTab('signin')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all bg-white text-jasper-900 shadow-sm">Sign In</button>
                            <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all text-gray-500 hover:text-jasper-900">Sign Up</button>
                        </div>

                        <form id="form-signin" onsubmit="handleSignIn(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Email or Username</label>
                                <input type="text" id="signin-identity" required placeholder="Enter email/username (Admin: 7Dr-as)" class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 focus:outline-none focus:ring-2 focus:ring-jasper-600 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Password</label>
                                <div class="relative">
                                    <input type="password" id="signin-password" required placeholder="••••••••" class="w-full px-4 py-2.5 pr-10 rounded-xl border border-jasper-200 focus:outline-none focus:ring-2 focus:ring-jasper-600 text-sm">
                                    <button type="button" onclick="togglePasswordVisibility('signin-password', 'signin-eye')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                                        <i id="signin-eye" class="fa-solid fa-eye text-sm"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3 bg-jasper-600 hover:bg-jasper-700 text-white font-semibold rounded-xl shadow-md transition-all text-sm">Sign In</button>
                        </form>

                        <form id="form-signup" onsubmit="handleSignUp(event)" class="space-y-4 hidden">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Username *</label>
                                <input type="text" id="signup-username" required placeholder="Unique username" class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 focus:outline-none focus:ring-2 focus:ring-jasper-600 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Email Address *</label>
                                <input type="email" id="signup-email" required placeholder="name@example.com" class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 focus:outline-none focus:ring-2 focus:ring-jasper-600 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Password *</label>
                                <div class="relative">
                                    <input type="password" id="signup-password" required placeholder="••••••••" class="w-full px-4 py-2.5 pr-10 rounded-xl border border-jasper-200 focus:outline-none focus:ring-2 focus:ring-jasper-600 text-sm">
                                    <button type="button" onclick="togglePasswordVisibility('signup-password', 'signup-eye')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                                        <i id="signup-eye" class="fa-solid fa-eye text-sm"></i>
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Referral Link / Code (Optional)</label>
                                <input type="text" id="signup-referral" value="${refCode}" placeholder="Referrer username" class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 focus:outline-none focus:ring-2 focus:ring-jasper-600 text-sm">
                            </div>
                            <div class="flex items-start gap-3 pt-1">
                                <input type="checkbox" id="signup-terms" onchange="toggleSignUpButton()" class="mt-1 h-4 w-4 rounded border-gray-300 text-jasper-600 focus:ring-jasper-500">
                                <label for="signup-terms" class="text-xs text-gray-600 leading-relaxed">
                                    You are solely responsible for your own profits and losses. Withdrawals must be made within 7 days, otherwise your balance will expire.
                                </label>
                            </div>
                            <button type="submit" id="btn-signup-submit" disabled class="w-full py-3 bg-gray-300 text-gray-500 font-semibold rounded-xl shadow-sm transition-all text-sm cursor-not-allowed">Create Account</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function switchAuthTab(tab) {
            const signinForm = document.getElementById('form-signin');
            const signupForm = document.getElementById('form-signup');
            const signinTab = document.getElementById('tab-signin');
            const signupTab = document.getElementById('tab-signup');

            if (tab === 'signin') {
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                signinTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg transition-all bg-white text-jasper-900 shadow-sm";
                signupTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg transition-all text-gray-500 hover:text-jasper-900";
            } else {
                signupForm.classList.remove('hidden');
                signinForm.classList.add('hidden');
                signupTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg transition-all bg-white text-jasper-900 shadow-sm";
                signinTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg transition-all text-gray-500 hover:text-jasper-900";
            }
        }

        function togglePasswordVisibility(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.className = 'fa-solid fa-eye-slash text-sm';
            } else {
                field.type = 'password';
                icon.className = 'fa-solid fa-eye text-sm';
            }
        }

        function toggleSignUpButton() {
            const checkbox = document.getElementById('signup-terms');
            const btn = document.getElementById('btn-signup-submit');
            if (checkbox.checked) {
                btn.disabled = false;
                btn.className = "w-full py-3 bg-jasper-600 hover:bg-jasper-700 text-white font-semibold rounded-xl shadow-md transition-all text-sm cursor-pointer";
            } else {
                btn.disabled = true;
                btn.className = "w-full py-3 bg-gray-300 text-gray-500 font-semibold rounded-xl shadow-sm transition-all text-sm cursor-not-allowed";
            }
        }

        function handleSignIn(e) {
            e.preventDefault();
            const identity = document.getElementById('signin-identity').value.trim();
            const pass = document.getElementById('signin-password').value.trim();

            if (identity === '7Dr-as') {
                const adminUser = { username: 'admin', email: '7Dr-as', balance: 0 };
                setCurrentUser(adminUser);
                showToast('Welcome to Admin Panel', 'success');
                router();
                return;
            }

            const users = getStorage(DB_KEYS.USERS);
            const found = users.find(u => (u.email === identity || u.username === identity) && u.pass === pass);

            if (found) {
                setCurrentUser(found);
                showToast(`Welcome back, ${found.username}!`);
                router();
            } else {
                showToast('Invalid credentials or user not found.', 'error');
            }
        }

        function handleSignUp(e) {
            e.preventDefault();
            const username = document.getElementById('signup-username').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const pass = document.getElementById('signup-password').value.trim();
            const referrer = document.getElementById('signup-referral').value.trim();

            const users = getStorage(DB_KEYS.USERS);
            if (users.some(u => u.username === username)) {
                showToast('Username already taken. Please choose another.', 'error');
                return;
            }
            if (users.some(u => u.email === email)) {
                showToast('Email address already registered.', 'error');
                return;
            }

            const newUser = {
                username,
                email,
                pass,
                balance: 0,
                referrer: referrer || '',
                depositsCount: 0,
                createdAt: Date.now()
            };

            users.push(newUser);
            setStorage(DB_KEYS.USERS, users);
            setCurrentUser(newUser);
            showToast('Account created successfully!');
            router();
        }

        /* ==========================================================
           2. ADMIN PANEL
           ================================================---------- */
        function renderAdminPanel() {
            const deposits = getStorage(DB_KEYS.DEPOSITS);
            const pendingDeposits = deposits.filter(d => d.status === 'pending');
            const withdrawals = getStorage(DB_KEYS.WITHDRAWALS);
            const pendingWithdrawals = withdrawals.filter(w => w.status === 'pending');
            const users = getStorage(DB_KEYS.USERS);

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen bg-jasper-50 flex flex-col">
                    <header class="bg-white border-b border-jasper-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <h2 class="text-xl font-bold text-jasper-900">Boxify Gift — Admin Panel</h2>
                        <button onclick="handleLogout()" class="px-4 py-2 bg-rose-50 text-rose-600 font-semibold rounded-xl text-sm hover:bg-rose-100 transition-all">Sign Out</button>
                    </header>
                    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">
                        
                        <section class="bg-white rounded-2xl shadow-sm border border-jasper-100 p-6">
                            <h3 class="text-lg font-bold text-jasper-900 mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-receipt text-amber-500"></i> Pending Deposit Approvals
                            </h3>
                            ${pendingDeposits.length === 0 ? '<p class="text-gray-500 text-sm">No pending deposits.</p>' : `
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left text-sm">
                                        <thead class="bg-jasper-50 text-jasper-800 font-semibold uppercase text-xs">
                                            <tr>
                                                <th class="p-3">User</th>
                                                <th class="p-3">Amount</th>
                                                <th class="p-3">Screenshot Proof</th>
                                                <th class="p-3">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-jasper-100">
                                            ${pendingDeposits.map(d => `
                                                <tr>
                                                    <td class="p-3 font-semibold">${d.username}</td>
                                                    <td class="p-3 font-bold text-emerald-600">Rs. ${d.amount}</td>
                                                    <td class="p-3"><span class="text-jasper-600 underline cursor-pointer" onclick="showProofModal('${d.proof}')">View Proof</span></td>
                                                    <td class="p-3 flex gap-2">
                                                        <button onclick="approveDeposit('${d.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold">Approve</button>
                                                        <button onclick="rejectDeposit('${d.id}')" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-semibold">Reject</button>
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            `}
                        </section>

                        <section class="bg-white rounded-2xl shadow-sm border border-jasper-100 p-6">
                            <h3 class="text-lg font-bold text-jasper-900 mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-wallet text-indigo-500"></i> Pending Withdrawals & User Audit
                            </h3>
                            ${pendingWithdrawals.length === 0 ? '<p class="text-gray-500 text-sm">No pending withdrawals.</p>' : `
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left text-sm">
                                        <thead class="bg-jasper-50 text-jasper-800 font-semibold uppercase text-xs">
                                            <tr>
                                                <th class="p-3">User</th>
                                                <th class="p-3">Method</th>
                                                <th class="p-3">Account Details</th>
                                                <th class="p-3">Referral Status</th>
                                                <th class="p-3">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-jasper-100">
                                            ${pendingWithdrawals.map(w => {
                                                const uRefs = users.filter(u => u.referrer === w.username);
                                                const depositingRefs = uRefs.filter(u => u.depositsCount > 0).length;
                                                return `
                                                    <tr>
                                                        <td class="p-3 font-semibold">${w.username}</td>
                                                        <td class="p-3 font-semibold">${w.method}</td>
                                                        <td class="p-3">${w.accNo} (${w.accName})</td>
                                                        <td class="p-3 font-bold ${depositingRefs >= 5 ? 'text-emerald-600' : 'text-rose-600'}">${depositingRefs}/5 depositing refs</td>
                                                        <td class="p-3 flex gap-2">
                                                            <button onclick="processWithdrawal('${w.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold">Process</button>
                                                        </td>
                                                    </tr>
                                                `;
                                            }).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            `}
                        </section>

                    </main>
                </div>
            `;
        }

        function showProofModal(proofText) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl max-w-lg w-full p-6 text-center space-y-4">
                        <h3 class="text-lg font-bold text-jasper-900">Deposit Proof</h3>
                        <div class="p-6 bg-jasper-50 rounded-xl border border-dashed border-jasper-200 text-gray-700 font-medium">
                            <i class="fa-solid fa-file-image text-4xl text-jasper-600 mb-2"></i>
                            <p>${proofText}</p>
                        </div>
                        <button onclick="closeModal()" class="w-full py-2.5 bg-jasper-600 text-white font-semibold rounded-xl text-sm">Close</button>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function approveDeposit(depId) {
            let deposits = getStorage(DB_KEYS.DEPOSITS);
            const dep = deposits.find(d => d.id === depId);
            if (!dep) return;
            dep.status = 'approved';
            setStorage(DB_KEYS.DEPOSITS, deposits);

            let users = getStorage(DB_KEYS.USERS);
            const user = users.find(u => u.username === dep.username);
            if (user) {
                user.balance = (user.balance || 0) + dep.amount;
                user.depositsCount = (user.depositsCount || 0) + 1;
                setStorage(DB_KEYS.USERS, users);
            }
            showToast('Deposit approved successfully!');
            renderAdminPanel();
        }

        function rejectDeposit(depId) {
            let deposits = getStorage(DB_KEYS.DEPOSITS);
            const dep = deposits.find(d => d.id === depId);
            if (dep) {
                dep.status = 'rejected';
                setStorage(DB_KEYS.DEPOSITS, deposits);
                showToast('Deposit rejected.', 'error');
                renderAdminPanel();
            }
        }

        function processWithdrawal(wId) {
            let withdrawals = getStorage(DB_KEYS.WITHDRAWALS);
            const w = withdrawals.find(item => item.id === wId);
            if (w) {
                w.status = 'processed';
                setStorage(DB_KEYS.WITHDRAWALS, withdrawals);
                showToast('Withdrawal processed successfully!');
                renderAdminPanel();
            }
        }

        function handleLogout() {
            setCurrentUser(null);
            showToast('Signed out successfully');
            router();
        }

        /* ==========================================================
           3. USER DASHBOARD & GAMEPLAY
           ================================================---------- */
        function renderDashboard(subView = 'home') {
            const user = getCurrentUser();
            const users = getStorage(DB_KEYS.USERS);
            const currentUserData = users.find(u => u.username === user.username) || user;

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen bg-jasper-50 flex flex-col relative">
                    <header class="bg-white border-b border-jasper-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <h2 class="text-xl font-bold tracking-tight text-jasper-900 cursor-pointer" onclick="window.location.hash='home'">Boxify Gift</h2>
                        <div class="flex items-center gap-4">
                            <span class="text-sm font-semibold text-gray-700 hidden sm:inline">Hi, ${currentUserData.username}</span>
                            <button onclick="toggleSidebarMenu()" class="w-10 h-10 rounded-xl bg-jasper-50 hover:bg-jasper-100 flex items-center justify-center text-jasper-900 transition-all">
                                <i class="fa-solid fa-bars text-lg"></i>
                            </button>
                        </div>
                    </header>

                    <div id="sidebar-menu" class="fixed inset-y-0 right-0 z-50 w-72 bg-white shadow-2xl border-l border-jasper-200 transform translate-x-full transition-transform duration-300 flex flex-col">
                        <div class="p-6 border-b border-jasper-100 flex justify-between items-center">
                            <h3 class="font-bold text-jasper-900 text-lg">Menu</h3>
                            <button onclick="toggleSidebarMenu()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>
                        <nav class="flex-1 p-4 space-y-2">
                            <a href="#home" onclick="toggleSidebarMenu()" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-jasper-900 hover:bg-jasper-50 transition-all"><i class="fa-solid fa-house w-5 text-jasper-600"></i> Home</a>
                            <a href="#referrals" onclick="toggleSidebarMenu()" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-jasper-900 hover:bg-jasper-50 transition-all"><i class="fa-solid fa-users w-5 text-jasper-600"></i> Your Referrals</a>
                            <a href="#withdraw" onclick="toggleSidebarMenu()" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-jasper-900 hover:bg-jasper-50 transition-all"><i class="fa-solid fa-wallet w-5 text-jasper-600"></i> Withdraw</a>
                            <a href="#terms" onclick="toggleSidebarMenu()" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-jasper-900 hover:bg-jasper-50 transition-all"><i class="fa-solid fa-file-contract w-5 text-jasper-600"></i> Term and Conditions</a>
                        </nav>
                        <div class="p-4 border-t border-jasper-100">
                            <button onclick="handleLogout()" class="w-full py-3 bg-rose-50 text-rose-600 font-semibold rounded-xl text-sm hover:bg-rose-100 transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-right-from-bracket"></i> Sign Out
                            </button>
                        </div>
                    </div>

                    <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">
                        
                        <div onclick="openWithdrawModalFromBalance()" class="text-center py-4 bg-white rounded-2xl shadow-sm border border-jasper-100 cursor-pointer hover:border-jasper-600 transition-all">
                            <span class="text-xs font-semibold uppercase tracking-wider text-gray-500">Available Balance (Click to Withdraw)</span>
                            <h3 class="text-3xl font-extrabold text-jasper-900 mt-1">Rs. ${currentUserData.balance || 0}</h3>
                        </div>

                        ${subView === 'home' ? renderHomeView(currentUserData) : ''}
                        ${subView === 'referrals' ? renderReferralsView(currentUserData, users) : ''}
                        ${subView === 'withdraw' ? renderWithdrawView(currentUserData, users) : ''}
                        ${subView === 'terms' ? renderTermsView() : ''}

                    </main>
                </div>
            `;
        }

        function toggleSidebarMenu() {
            document.getElementById('sidebar-menu').classList.toggle('translate-x-full');
        }

        function renderHomeView(user) {
            const hasActiveBalance = (user.balance || 0) > 0;

            return `
                <div class="bg-gradient-to-r from-jasper-800 to-jasper-700 text-white rounded-2xl p-6 shadow-md space-y-4">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-gift text-3xl text-amber-300"></i>
                        <div>
                            <h4 class="font-bold text-lg">Bigger the deposit, bigger the reward. Minimum deposit will be Rs. 100.</h4>
                            <p class="text-xs text-jasper-100 mt-0.5">Send payment via EasyPaisa, then submit your screenshot proof below.</p>
                        </div>
                    </div>
                    <div class="bg-white/10 rounded-xl p-4 backdrop-blur-sm grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
                        <div>
                            <span class="block text-xs text-jasper-200 uppercase font-semibold">Account Type</span>
                            <span class="font-bold">EasyPaisa</span>
                        </div>
                        <div>
                            <span class="block text-xs text-jasper-200 uppercase font-semibold">Account Number</span>
                            <div class="flex items-center gap-2">
                                <span class="font-bold">03074591741</span>
                                <button onclick="copyToClipboard('03074591741', 'Account Number')" class="text-amber-300 hover:text-white"><i class="fa-solid fa-copy"></i></button>
                            </div>
                        </div>
                        <div>
                            <span class="block text-xs text-jasper-200 uppercase font-semibold">Account Holder Name</span>
                            <span class="font-bold">Adnan Ahmad</span>
                        </div>
                    </div>
                    <button onclick="openDepositModal()" class="w-full py-3 bg-white text-jasper-900 font-bold rounded-xl shadow hover:bg-jasper-50 transition-all text-sm">Deposit Now</button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-jasper-100 p-6 space-y-6">
                    <div class="text-center">
                        <h3 class="text-xl font-bold text-jasper-900">You can select any Three Box</h3>
                        ${!hasActiveBalance ? '<p class="text-xs text-rose-600 mt-1 font-semibold">Deposit and wait for admin approval to unlock box picks.</p>' : '<p class="text-xs text-emerald-600 mt-1 font-semibold">Active session unlocked! Pick 3 boxes.</p>'}
                    </div>

                    <div id="boxes-grid" class="grid grid-cols-3 sm:grid-cols-5 gap-4">
                        ${Array.from({length: 15}).map((_, i) => `
                            <div onclick="handleBoxClick(${i})" id="box-${i}" class="mystery-box aspect-square bg-gradient-to-br from-jasper-600 to-jasper-800 rounded-2xl shadow-md flex flex-col items-center justify-center cursor-pointer hover:scale-105 transition-all text-white p-2 text-center group">
                                <i class="fa-solid fa-box-open text-3xl mb-1 text-amber-300 group-hover:rotate-12 transition-transform"></i>
                                <span class="text-xs font-semibold">Box #${i+1}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-jasper-100 p-6 space-y-4">
                    <h3 class="text-base font-bold text-jasper-900 flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-amber-500 animate-pulse"></i> Live Activity Feed
                    </h3>
                    <div id="live-feed-ticker" class="space-y-2"></div>
                </div>
            `;
        }

        function renderReferralsView(user, users) {
            const userRefs = users.filter(u => u.referrer === user.username);
            const myRefLink = `${window.location.origin}${window.location.pathname}?ref=${user.username}`;
            
            return `
                <div class="bg-white rounded-2xl shadow-sm border border-jasper-100 p-6 space-y-6">
                    <h3 class="text-xl font-bold text-jasper-900">Your Referrals</h3>
                    <p class="text-sm text-gray-600">Share your referral link with friends. 5 active depositing referrals are required to withdraw.</p>
                    
                    <div class="flex items-center gap-2 p-3 bg-jasper-50 rounded-xl border border-jasper-200">
                        <input type="text" readonly value="${myRefLink}" class="w-full bg-transparent text-sm text-gray-700 outline-none">
                        <button onclick="copyToClipboard('${myRefLink}', 'Referral Link')" class="px-4 py-2 bg-jasper-600 text-white rounded-lg text-xs font-semibold shrink-0">Copy Link</button>
                    </div>

                    <div class="space-y-3">
                        <h4 class="font-bold text-sm text-jasper-900">Your Referral List (${userRefs.length})</h4>
                        ${userRefs.length === 0 ? '<p class="text-xs text-gray-500">No referrals yet.</p>' : `
                            <div class="divide-y divide-jasper-100 border border-jasper-100 rounded-xl overflow-hidden">
                                ${userRefs.map(ref => `
                                    <div class="p-3 flex justify-between items-center text-sm">
                                        <span class="font-semibold">${ref.username}</span>
                                        <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${ref.depositsCount > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                            ${ref.depositsCount > 0 ? 'Deposited' : 'Pending Deposit'}
                                        </span>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderWithdrawView(user, users) {
            const userRefs = users.filter(u => u.referrer === user.username);
            const depositingRefs = userRefs.filter(u => u.depositsCount > 0).length;
            const myRefLink = `${window.location.origin}${window.location.pathname}?ref=${user.username}`;

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-jasper-100 p-6 space-y-6 max-w-xl mx-auto">
                    <h3 class="text-xl font-bold text-jasper-900">Withdraw Funds</h3>
                    <p class="text-sm text-gray-600">Available Balance: <strong class="text-jasper-900">Rs. ${user.balance || 0}</strong></p>
                    
                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-xs">
                        <i class="fa-solid fa-triangle-exclamation mr-1"></i> Referral Status: <strong class="font-bold">${depositingRefs}/5</strong> active depositing referrals.
                    </div>

                    <form onsubmit="handleWithdrawSubmit(event, ${depositingRefs})" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Account Type</label>
                            <select id="withdraw-method" class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 text-sm focus:outline-none focus:ring-2 focus:ring-jasper-600">
                                <option value="EasyPaisa">EasyPaisa</option>
                                <option value="JazzCash">JazzCash</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Account Number</label>
                            <input type="text" id="withdraw-accno" required placeholder="03XXXXXXXXX" class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 text-sm focus:outline-none focus:ring-2 focus:ring-jasper-600">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Account Holder Name</label>
                            <input type="text" id="withdraw-accname" required placeholder="Full Name" class="w-full px-4 py-2.5 rounded-xl border border-jasper-200 text-sm focus:outline-none focus:ring-2 focus:ring-jasper-600">
                        </div>
                        <button type="submit" class="w-full py-3 bg-jasper-600 hover:bg-jasper-700 text-white font-semibold rounded-xl shadow text-sm">Submit Request</button>
                    </form>

                    <div class="pt-4 border-t border-jasper-100">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Your Referral Link</label>
                        <div class="flex items-center gap-2 p-2.5 bg-jasper-50 rounded-xl border border-jasper-200">
                            <input type="text" readonly value="${myRefLink}" class="w-full bg-transparent text-xs text-gray-700 outline-none">
                            <button onclick="copyToClipboard('${myRefLink}', 'Referral Link')" class="px-3 py-1.5 bg-jasper-600 text-white rounded-lg text-xs font-semibold">Copy</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTermsView() {
            return `
                <div class="bg-white rounded-2xl shadow-sm border border-jasper-100 p-6 space-y-4">
                    <h3 class="text-xl font-bold text-jasper-900">Term and Conditions</h3>
                    <div class="space-y-3 text-sm text-gray-600 leading-relaxed">
                        <p>1. You are solely responsible for your own profits and losses.</p>
                        <p>2. Withdrawals must be made within 7 days, otherwise your balance will expire.</p>
                        <p>3. Minimum deposit is Rs. 100.</p>
                        <p>4. Withdrawals require at least 5 active depositing referrals.</p>
                    </div>
                </div>
            `;
        }

        /* ==========================================================
           DEPOSIT & GAMEPLAY FLOWS
           ================================================---------- */
        function openDepositModal() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
                        <h3 class="text-lg font-bold text-jasper-900">Send your Deposit proof</h3>
                        <p class="text-xs text-gray-500">Upload screenshot receipt of your EasyPaisa transfer.</p>
                        <input type="file" id="deposit-file-input" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-jasper-50 file:text-jasper-700 hover:file:bg-jasper-100">
                        <div class="flex gap-3 pt-2">
                            <button onclick="closeModal()" class="flex-1 py-2.5 bg-gray-100 text-gray-700 font-semibold rounded-xl text-sm">Cancel</button>
                            <button onclick="submitDepositProof()" class="flex-1 py-2.5 bg-jasper-600 text-white font-semibold rounded-xl text-sm">Submit</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function submitDepositProof() {
            const user = getCurrentUser();
            const fileInput = document.getElementById('deposit-file-input');
            const proofName = fileInput.files[0] ? fileInput.files[0].name : 'receipt_proof.png';

            const newDeposit = {
                id: 'dep_' + Date.now(),
                username: user.username,
                amount: 100,
                proof: proofName,
                status: 'pending',
                timestamp: Date.now()
            };

            let deposits = getStorage(DB_KEYS.DEPOSITS);
            deposits.push(newDeposit);
            setStorage(DB_KEYS.DEPOSITS, deposits);

            closeModal();
            showToast('Your deposit is being verified.');
        }

        // Gameplay Box Session State
        let gameState = {
            picksLeft: 3,
            totalWon: 0,
            openedBoxes: []
        };

        function handleBoxClick(index) {
            const user = getCurrentUser();
            if (!user || (user.balance || 0) <= 0) {
                showToast('You need an approved deposit balance to play boxes!', 'error');
                return;
            }
            if (gameState.picksLeft <= 0) {
                showToast('Game session complete! Make a new deposit to play again.', 'error');
                return;
            }
            if (gameState.openedBoxes.includes(index)) {
                showToast('Box already opened!', 'error');
                return;
            }

            gameState.openedBoxes.push(index);
            gameState.picksLeft--;

            const reward = Math.floor(Math.random() * 15) + 10; // Combined range 30-50%
            gameState.totalWon += reward;

            const boxEl = document.getElementById(`box-${index}`);
            boxEl.className = "mystery-box aspect-square bg-emerald-600 rounded-2xl shadow-md flex flex-col items-center justify-center text-white p-2 text-center";
            boxEl.innerHTML = `<i class="fa-solid fa-coins text-3xl mb-1 text-amber-300"></i><span class="text-sm font-bold">+Rs. ${reward}</span>`;

            showClaimModal(reward);

            if (gameState.picksLeft === 0) {
                setTimeout(autoRevealRemainingBoxes, 1200);
            }
        }

        function showClaimModal(reward) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
                        <div class="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center mx-auto text-amber-600 text-3xl">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <h3 class="text-2xl font-bold text-jasper-900">Congratulations!</h3>
                        <p class="text-sm text-gray-600">You won <strong class="text-emerald-600 text-lg">Rs. ${reward}</strong> from this box.</p>
                        <button onclick="claimReward(${reward})" class="w-full py-3 bg-jasper-600 hover:bg-jasper-700 text-white font-semibold rounded-xl text-sm shadow-md">Claim Reward</button>
                    </div>
                </div>
            `;
        }

        function claimReward(reward) {
            const user = getCurrentUser();
            let users = getStorage(DB_KEYS.USERS);
            const dbUser = users.find(u => u.username === user.username);
            if (dbUser) {
                dbUser.balance = (dbUser.balance || 0) + reward;
                setStorage(DB_KEYS.USERS, users);
                setCurrentUser(dbUser);
            }
            closeModal();
            showToast(`Added Rs. ${reward} to your balance!`);
            
            let feed = getStorage(DB_KEYS.LIVE_FEED);
            feed.unshift({ user: user.username, amount: reward, time: 'Just now' });
            setStorage(DB_KEYS.LIVE_FEED, feed);
            renderLiveFeedTicker();
        }

        function autoRevealRemainingBoxes() {
            const revealValues = [0, 0, 50, 50, 10, 10, 100, 100, 500, 500, 1000, 1000];
            revealValues.sort(() => Math.random() - 0.5);

            let unOpenedIndices = [];
            for (let i = 0; i < 15; i++) {
                if (!gameState.openedBoxes.includes(i)) unOpenedIndices.push(i);
            }

            unOpenedIndices.forEach((boxIdx, idx) => {
                setTimeout(() => {
                    const boxEl = document.getElementById(`box-${boxIdx}`);
                    if (boxEl) {
                        const val = revealValues[idx] || 50;
                        boxEl.className = "mystery-box aspect-square bg-jasper-900 rounded-2xl shadow-md flex flex-col items-center justify-center text-white p-2 text-center opacity-80";
                        boxEl.innerHTML = `<i class="fa-solid fa-box text-2xl mb-1 text-gray-400"></i><span class="text-xs font-bold text-amber-300">Rs. ${val}</span>`;
                    }
                }, idx * 1000);
            });
        }

        function openWithdrawModalFromBalance() {
            window.location.hash = 'withdraw';
        }

        function handleWithdrawSubmit(e, depositingRefs) {
            e.preventDefault();
            
            if (depositingRefs < 5) {
                showPersistentReferralModal();
                return;
            }

            const method = document.getElementById('withdraw-method').value;
            const accNo = document.getElementById('withdraw-accno').value.trim();
            const accName = document.getElementById('withdraw-accname').value.trim();
            const user = getCurrentUser();

            const newWithdrawal = {
                id: 'w_' + Date.now(),
                username: user.username,
                method,
                accNo,
                accName,
                status: 'pending',
                timestamp: Date.now()
            };

            let withdrawals = getStorage(DB_KEYS.WITHDRAWALS);
            withdrawals.push(newWithdrawal);
            setStorage(DB_KEYS.WITHDRAWALS, withdrawals);

            showToast('Withdrawal request submitted successfully!');
            window.location.hash = 'home';
        }

        function showPersistentReferralModal() {
            const user = getCurrentUser();
            const myRefLink = `${window.location.origin}${window.location.pathname}?ref=${user.username}`;
            
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl">
                        <div class="w-16 h-16 bg-rose-100 rounded-full flex items-center justify-center mx-auto text-rose-600 text-3xl">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>
                        <h3 class="text-xl font-bold text-jasper-900">Referral Requirement Unmet</h3>
                        <p class="text-sm text-gray-600 leading-relaxed">
                            You must complete 5 active referrals who have made a deposit in order to withdraw.
                        </p>
                        <div class="p-3 bg-jasper-50 rounded-xl border border-jasper-200 text-left">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Your Referral Link</label>
                            <div class="flex items-center gap-2">
                                <input type="text" readonly value="${myRefLink}" class="w-full bg-transparent text-xs text-gray-700 outline-none">
                                <button onclick="copyToClipboard('${myRefLink}', 'Referral Link')" class="px-3 py-1 bg-jasper-600 text-white rounded-lg text-xs font-semibold shrink-0">Copy</button>
                            </div>
                        </div>
                        <button onclick="closeModal()" class="w-full py-3 bg-jasper-600 hover:bg-jasper-700 text-white font-semibold rounded-xl text-sm shadow-md">OK</button>
                    </div>
                </div>
            `;
        }

        /* ==========================================================
           LIVE FEED TICKER
           ================================================---------- */
        function renderLiveFeedTicker() {
            const container = document.getElementById('live-feed-ticker');
            if (!container) return;

            const feed = getStorage(DB_KEYS.LIVE_FEED);
            container.innerHTML = feed.slice(0, 5).map(item => `
                <div class="flex justify-between items-center p-3 bg-jasper-50 rounded-xl text-sm">
                    <span class="font-medium text-jasper-900"><i class="fa-solid fa-user-circle text-jasper-600 mr-2"></i> ${item.user} won <strong class="text-emerald-600">Rs. ${item.amount}</strong></span>
                    <span class="text-xs text-gray-400">${item.time}</span>
                </div>
            `).join('');
        }

        setInterval(() => {
            const randomUsers = ['player_one', 'ref1', 'ref2', 'ref3', 'alex_99', 'sam_dev'];
            const randomAmounts = [30, 45, 50, 35, 40, 55];
            const rUser = randomUsers[Math.floor(Math.random() * randomUsers.length)];
            const rAmt = randomAmounts[Math.floor(Math.random() * randomAmounts.length)];

            let feed = getStorage(DB_KEYS.LIVE_FEED);
            feed.unshift({ user: rUser, amount: rAmt, time: 'Just now' });
            setStorage(DB_KEYS.LIVE_FEED, feed);
            renderLiveFeedTicker();
        }, 5000);

        window.addEventListener('DOMContentLoaded', () => {
            router();
            setInterval(renderLiveFeedTicker, 2000);
        });
    </script>
</body>
</html>
